[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-note-agents"
version = "0.1.0"
description = "Local material ingestion and classification for autonomous course note generation."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.scripts]
course-note-ingest = "course_note_agents.ingestion.cli:main"
course-note-parse = "course_note_agents.parsing.cli:main"
course-note-draft = "course_note_agents.drafting.cli:main"
course-note-review = "course_note_agents.reviewing.cli:main"
course-note-textbook = "course_note_agents.textbook.cli:main"
course-note-polish = "course_note_agents.polishing.cli:main"
course-note-layout = "course_note_agents.layout.cli:main"
course-note-run = "course_note_agents.workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
